# Source of docs/DATA_DICTIONARY.md (generated by `make dictionary`). Every column of every
# processed table must be described here; the generator fails otherwise.
# Attribute meanings follow the StatsBomb Open Data Events specification v4.0.0 (repo doc/).

common_event_columns:
  event_id: StatsBomb event UUID (unique across all matches).
  match_id: StatsBomb match id.
  competition_id: StatsBomb competition id.
  season_id: StatsBomb season id (27 = 2015/16).
  event_index: Order of the event within the match (1..n).
  period: 1 = first half, 2 = second half.
  timestamp: Time since the start of the period, "HH:MM:SS.fff", as published.
  period_seconds: "`timestamp` in seconds."
  match_seconds: Real time since kick-off in seconds (earlier periods counted at their actual length, stoppage time included).
  minute: Match clock minute (restarts at 45 in the second half).
  second: Match clock second.
  possession: Possession sequence number within the match.
  possession_team_id: Team that started the possession in control of the ball (also present on opponents' events).
  play_pattern: Phase the event belongs to (Regular Play, From Corner, From Free Kick, From Throw In, From Counter, From Goal Kick, From Keeper, From Kick Off, Other).
  team_id: Team performing the event.
  player_id: Player performing the event (null for team events such as Half Start).
  position_id: StatsBomb position id of the player at the time of the event (1-25, see position groups).
  position: StatsBomb position name.
  x: Event location along the pitch, 0.1-120.0 on a 0.1-yard grid; the acting team always attacks towards x = 120.
  y: Event location across the pitch, 0.1-80.0 (the touchlines); y = 0 is the acting team's left.
  duration: Length of the event in seconds, where relevant.
  under_pressure: Performed while pressured by an opponent (StatsBomb definition, Appendix 7).
  counterpress: Pressing action within 5 seconds of an open-play turnover.
  off_camera: Event happened while the broadcast camera was off; location is inferred.
  out: The event ended with the ball going out of bounds.

tables:
  # ---------------------------------------------------------------- StatsBomb dimensions
  statsbomb/competitions:
    description: The five StatsBomb competition-seasons used, with the project configuration.
    grain: one row per competition-season
    columns:
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      competition_name: Competition name.
      country_name: Country of the competition.
      season_name: Season label (2015/2016).
      competition_gender: male / female.
      scouting_pool: True for the four complete leagues compared league-wide; false for the Bundesliga sample (Bayer Leverkusen's matches only).
      transfermarkt_competition_id: The same league in Transfermarkt (GB1, ES1, IT1, FR1, L1).
      transfermarkt_season: The same season in Transfermarkt (`games.season`, 2015 = 2015/16).

  statsbomb/matches:
    description: Match metadata plus the real length of each half.
    grain: one row per match
    columns:
      match_id: StatsBomb match id.
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      scouting_pool: Match belongs to a scouting-pool league.
      match_date: Match date.
      kick_off: Kick-off time as published ("HH:MM:SS.fff").
      match_week: Matchday.
      competition_stage: Competition stage (Regular Season for all matches here).
      home_team_id: Home team.
      away_team_id: Away team.
      home_score: Home goals at full time.
      away_score: Away goals at full time.
      home_manager: First home manager listed.
      away_manager: First away manager listed.
      stadium: Stadium name.
      referee: Referee name.
      data_version: StatsBomb data version (1.1.0; null for 2 matches).
      shot_fidelity_version: '2 = high-fidelity shot coordinates (null for 2 matches).'
      xy_fidelity_version: '2 = high-fidelity coordinates for other events (null for 2 matches).'
      period_1_seconds: Real length of the first half in seconds (timestamp of its Half End event).
      period_2_seconds: Real length of the second half in seconds.
      duration_seconds: Real length of the match in seconds (sum of the halves).

  statsbomb/periods:
    description: Real length of every period, from the Half End events.
    grain: one row per match and period
    columns:
      match_id: StatsBomb match id.
      period: Period number.
      duration_seconds: Real length of the period in seconds.

  statsbomb/teams:
    description: Teams per competition-season.
    grain: one row per team and competition-season
    columns:
      team_id: StatsBomb team id.
      team_name: Team name (most frequent spelling, apostrophes unescaped).
      country: Country of the team.
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      matches: Matches of the team in the data (Ligue 1 teams missing a match have 37; Bundesliga opponents 1 or 2).

  statsbomb/players:
    description: Players listed in any lineup (including unused substitutes).
    grain: one row per player
    columns:
      player_id: StatsBomb player id.
      player_name: Full name (most frequent spelling across lineups, apostrophes unescaped).
      player_nickname: Common name when StatsBomb has one (e.g. "Isco").
      country: Nationality (most frequent across lineups).
      name_varies: The name is spelled differently in some lineups.
      country_varies: The nationality differs between lineups (dual nationals).

  # ---------------------------------------------------------------- minutes and positions
  statsbomb/player_matches:
    description: >-
      Every player listed in a lineup, with real time on the pitch. Time ends at the first
      exit (substitution event or dismissal), temporary absences are excluded, overlapping
      stints are counted once (see `model/minutes.py`).
    grain: one row per player and match
    columns:
      match_id: StatsBomb match id.
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      team_id: Team the player was listed for.
      player_id: StatsBomb player id.
      jersey_number: Shirt number.
      started: On the pitch at kick-off (equals the Starting XI event).
      played: Spent any time on the pitch.
      seconds_played: Real seconds on the pitch, stoppage time included.
      minutes_played: "`seconds_played` / 60; the base of every per-90 metric."
      on_seconds: First time on the pitch (match_seconds).
      off_seconds: Last time on the pitch (match_seconds).
      main_position_id: Position with the most time in this match.
      main_position_group: Position group of `main_position_id` (GK, CB, FB, CM, AM, W, CF).
      n_stints: Number of position stints.
      dismissed: Received a red card or second yellow (also when already off the pitch).
      dismissal_seconds: Time of the dismissal (match_seconds).
      substituted_off: Was replaced by a substitute.
      substitution_seconds: Time of the substitution (match_seconds).
      exit_kind: "How the player's time ended early: substitution, dismissal, or null (played to the end or never played)."
      exit_seconds: Time of that exit (match_seconds).
      match_end_seconds: Real length of the match in seconds.

  statsbomb/player_positions:
    description: Time spent in each position, after applying exits and removing overlaps.
    grain: one row per player stint in a position (only stints with time > 0)
    columns:
      match_id: StatsBomb match id.
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      team_id: Team.
      player_id: StatsBomb player id.
      position_id: StatsBomb position id.
      position: StatsBomb position name.
      position_group: GK, CB, FB, CM, AM, W or CF (see `config/pipeline.yaml`).
      start_seconds: Start of the stint (match_seconds).
      end_seconds: End of the stint (match_seconds).
      seconds: Length of the stint in seconds.
      start_reason: Why the stint started (Starting XI, Substitution - On, Tactical Shift, Player On, ...).
      end_reason: Why the stint ended, as published in the lineup.
      truncated_by: "Set when the published stint was cut at the player's exit: substitution or dismissal."
      overlap_trimmed: The stint overlapped an earlier stint of the same player and was trimmed.

  statsbomb/player_seasons:
    description: Season totals and primary position per player and team. The minutes_<group> columns add up to `minutes` (0 for groups the player never played in).
    grain: one row per player, team and competition-season (a player who changed clubs mid-season has one row per club)
    columns:
      player_id: StatsBomb player id.
      team_id: Team.
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      matches_in_squad: Matches listed in the lineup.
      matches_played: Matches with time on the pitch.
      starts: Matches started.
      minutes: Real minutes on the pitch.
      dismissals: Matches with a dismissal while on the pitch or after playing.
      primary_position_id: Position with the most minutes for this team.
      primary_position_group: Position group of `primary_position_id`.
      minutes_gk: Minutes as goalkeeper.
      minutes_cb: Minutes as centre-back.
      minutes_fb: Minutes as full-back / wing-back.
      minutes_cm: Minutes in central midfield.
      minutes_am: Minutes in attacking midfield.
      minutes_w: Minutes as wide midfielder / winger.
      minutes_cf: Minutes as centre-forward.

  # ---------------------------------------------------------------- events
  statsbomb/events:
    description: All events with the common columns (type-specific attributes are in the event-type tables).
    grain: one row per event
    columns:
      type: Event type (Pass, Carry, Shot, Pressure, ...).
      related_events: Ids of related events (e.g. a shot and its goalkeeper event).

  statsbomb/passes:
    description: Pass events.
    columns:
      recipient_id: Intended recipient (player id).
      length: Pass length in yards.
      angle: Pass angle in radians; 0 = straight ahead, positive clockwise, ±π backwards.
      height: Ground Pass, Low Pass (below shoulder) or High Pass.
      end_x: End location x.
      end_y: End location y.
      body_part: Right Foot, Left Foot, Head, Keeper Arm, Drop Kick, No Touch, Other.
      pass_type: Set-piece or special pass type (Corner, Free Kick, Goal Kick, Throw-in, Kick Off, Interception, Recovery); null for open-play passes.
      switch: Switch of play (travels more than 40 yards across the pitch).
      outcome: Incomplete, Out, Pass Offside, Unknown or Injury Clearance; null when completed.
      aerial_won: The pass followed an aerial duel won.
      through_ball: Through ball (deprecated flag; same 6,660 passes as `technique` = Through Ball).
      technique: Through Ball, or corner technique (Inswinging, Outswinging, Straight).
      cross: Cross (StatsBomb zone definition, Appendix 6).
      cut_back: Cut-back (low pass backwards inside the box, Appendix 5).
      assisted_shot_id: The shot this pass assisted (event_id).
      shot_assist: Assisted a shot that did not score.
      outswinging: Outswinging corner (duplicates `technique`).
      inswinging: Inswinging corner (duplicates `technique`).
      goal_assist: Assisted a goal.
      miscommunication: Accurate pass misread by the receiver (or receiver's run misread by the passer).
      no_touch: The player let the ball run past without touching it (dummy).
      deflected: The pass was deflected.
      straight: Straight corner (duplicates `technique`).
      completed: "Derived: reached a teammate (`outcome` is null, StatsBomb convention)."

  statsbomb/shots:
    description: Shot events, with StatsBomb xG and the freeze frame.
    columns:
      statsbomb_xg: StatsBomb expected-goals value of the shot.
      end_x: End location x.
      end_y: End location y.
      end_z: End height; null for Blocked and Wayward shots.
      technique: Normal, Volley, Half Volley, Lob, Backheel, Diving Header, Overhead Kick.
      first_time: First-touch shot.
      body_part: Right Foot, Left Foot, Head, Other.
      shot_type: Open Play, Free Kick, Penalty, Corner.
      outcome: Goal, Saved, Off T, Blocked, Post, Wayward, Saved Off Target, Saved to Post.
      freeze_frame: "Players visible at the shot: list of {x, y, player_id, position_id, teammate}."
      key_pass_id: The pass that assisted the shot (event_id).
      one_on_one: One-on-one with the goalkeeper.
      aerial_won: The shot followed an aerial duel won.
      open_goal: Taken with an open goal.
      saved_to_post: Saved onto the post.
      saved_off_target: Saved although going off target.
      follows_dribble: Came after a successful dribble by the shooter.
      redirect: Redirected shot.
      deflected: Deflected by another player's touch.

  statsbomb/carries:
    description: Carry events (player moving with the ball at his feet).
    columns:
      end_x: End location x.
      end_y: End location y.

  statsbomb/dribbles:
    description: Dribble events (attempts to beat an opponent).
    columns:
      outcome: Complete or Incomplete.
      overrun: The dribble went past the defender into another player's possession.
      nutmeg: Through the opponent's legs.
      no_touch: Beat the opponent without touching the ball.

  statsbomb/pressures:
    description: Pressure events (pressing a player who receives, carries or releases the ball).

  statsbomb/duels:
    description: Duel events.
    columns:
      duel_type: Tackle or Aerial Lost.
      outcome: Won, Lost In Play, Lost Out, Success In Play, Success Out for tackles; null for Aerial Lost.

  statsbomb/ball_recoveries:
    description: Ball recovery events.
    columns:
      recovery_failure: The attempt to recover a loose ball failed.
      offensive: Recovery of a ball lost by a teammate.

  statsbomb/interceptions:
    description: Interception events.
    columns:
      outcome: Won, Lost In Play, Lost Out, Success In Play, Success Out.

  statsbomb/clearances:
    description: Clearance events.
    columns:
      right_foot: Cleared with the right foot.
      body_part: Head, Left Foot, Right Foot, Other.
      head: Cleared with the head.
      aerial_won: The clearance was an aerial duel won.
      left_foot: Cleared with the left foot.
      other: Cleared with another body part.

  statsbomb/blocks:
    description: Block events.
    columns:
      offensive: Block by the attacking team.
      deflection: The block did not reverse or strongly redirect the ball.
      save_block: Blocked a shot that was going on target.

  statsbomb/goalkeeper_actions:
    description: Goalkeeper events (one for every shot faced, plus collections, punches, sweeps).
    columns:
      end_x: End location x.
      end_y: End location y.
      goalkeeper_position: Keeper's state when the shot was taken (Set, Moving, Prone).
      goalkeeper_type: Shot Faced, Shot Saved, Goal Conceded, Penalty Conceded, Penalty Saved, Collected, Punch, Keeper Sweeper, Smother, Save, Shot Saved Off Target, Shot Saved to Post, Saved to Post, Penalty Saved to Post.
      outcome: Outcome of the action (Success, Claim, Clear, Collected Twice, Fail, In Play Safe, In Play Danger, Saved Twice, Touched In, Touched Out, No Touch, Punched out, Won, Lost In Play, Lost Out, Success In Play, Success Out).
      technique: Diving or Standing.
      body_part: Body part used (Both Hands, Left Hand, Right Hand, Chest, Head, Left Foot, Right Foot).
      success_in_play: Successful action, ball stays in play.
      shot_saved_to_post: Shot saved onto the post.
      shot_saved_off_target: Saved a shot that was going off target.
      punched_out: Punched out of bounds.
      lost_out: Ball lost out of bounds.
      lost_in_play: Ball lost in play.
      penalty_saved_to_post: Penalty saved onto the post.
      saved_to_post: Save onto the post.
      success_out: Successful action, ball out of bounds in the keeper's favour.

  statsbomb/fouls_committed:
    description: Fouls committed (offsides are not fouls).
    columns:
      offensive: Committed while in possession.
      advantage: Referee played advantage.
      card: Yellow Card, Second Yellow or Red Card.
      foul_type: Handball, Dangerous Play, Dive, 6 Seconds, Backpass Pick, Foul Out; null for ordinary fouls.
      penalty: A penalty was awarded.

  statsbomb/fouls_won:
    description: Fouls won.
    columns:
      defensive: Won while out of possession.
      advantage: Referee played advantage.
      penalty: Won a penalty.

  statsbomb/miscontrols:
    description: Miscontrols (ball lost through a bad touch).
    columns:
      aerial_won: The miscontrol followed an aerial duel won.

  statsbomb/dispossessions:
    description: Dispossessed events (ball lost to a tackle without attempting a dribble).

  statsbomb/dribbled_past:
    description: Dribbled Past events (the defender beaten by a dribble).

  statsbomb/ball_receipts:
    description: Ball receipts (receiving, or being the intended receiver of, a pass).
    columns:
      outcome: Incomplete when the ball was not received; null when received.

  statsbomb/fifty_fifties:
    description: 50/50 challenges for a loose ball.
    columns:
      outcome: Won, Lost, Success To Team, Success To Opposition.

  statsbomb/bad_behaviours:
    description: Cards for infringements outside of play.
    columns:
      card: Yellow Card, Second Yellow or Red Card.

  statsbomb/defensive_actions:
    description: >-
      Convenience union of defensive events, one row per action: Tackle (Duel of type
      Tackle), Interception, Block, Clearance, Ball Recovery, Foul Committed, 50/50.
      Pressures are not included (see `pressures`). Analyses choose which actions count.
    columns:
      action: Tackle, Interception, Block, Clearance, Ball Recovery, Foul Committed or 50/50.
      outcome: "Raw outcome where the source event has one: duel / interception / 50/50 outcome, 'Recovery Failure' for failed recoveries; null otherwise."

  statsbomb/formations:
    description: Starting XI and Tactical Shift events (formation and players' positions).
    grain: one row per Starting XI or Tactical Shift event
    columns:
      event_id: StatsBomb event UUID.
      match_id: StatsBomb match id.
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      period: Period.
      match_seconds: Real time since kick-off.
      type: Starting XI or Tactical Shift.
      team_id: Team.
      formation: Formation code (e.g. 4231 = 4-2-3-1).
      lineup: "List of {player_id, position_id, jersey_number}."

  # ---------------------------------------------------------------- links
  links/team_map:
    description: StatsBomb team-season -> Transfermarkt club.
    grain: one row per StatsBomb team and competition-season
    columns:
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      team_id: StatsBomb team id.
      team_name: StatsBomb team name.
      matches: StatsBomb matches of the team.
      club_id: Transfermarkt club id.
      club_name: Transfermarkt club name.
      votes: Matches whose date and score agree with this club (always equal to `matches`).
      runner_up_votes: Votes of the next best club (ties are broken by name similarity).

  links/match_map:
    description: StatsBomb match -> Transfermarkt game.
    grain: one row per StatsBomb match
    columns:
      match_id: StatsBomb match id.
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      game_id: Transfermarkt game id.
      day_diff: Days between the two published dates (0 for all matches).

  links/player_team_links:
    description: Player links per team-season with the evidence used.
    grain: one row per StatsBomb player, team and competition-season
    columns:
      sb_player_id: StatsBomb player id.
      team_id: StatsBomb team id.
      competition_id: StatsBomb competition id.
      season_id: StatsBomb season id.
      tm_player_id: Transfermarkt player id.
      sb_n_games: Linked games the player played in StatsBomb.
      tm_n_games: Linked games the player appeared in Transfermarkt.
      both_games: Games in both.
      sb_minutes: StatsBomb real minutes in those games.
      tm_minutes: Transfermarkt minutes in those games (nominal, about 90 per full match).
      sb_name: StatsBomb name.
      sb_nickname: StatsBomb nickname.
      sb_country: StatsBomb nationality.
      tm_name: Transfermarkt display name.
      tm_first_name: Transfermarkt first name.
      tm_last_name: Transfermarkt last name.
      tm_country: Transfermarkt citizenship.
      tm_date_of_birth: Transfermarkt date of birth.
      games_jaccard: both_games / games in either source.
      name_similarity: Best token-set similarity (0-1) over the name variants, accents removed.
      score: 0.6 x games_jaccard + 0.4 x name_similarity.
      runner_up_score: Best score of another candidate for the same StatsBomb player.
      margin: score - runner_up_score.
      confidence: high, medium, low (from the evidence) or manual.
      method: auto or manual (config/player_match_overrides.csv).
      reason: Reason for a manual decision.

  links/player_map:
    description: StatsBomb player -> Transfermarkt player (every player who played is linked).
    grain: one row per StatsBomb player
    columns:
      sb_player_id: StatsBomb player id.
      tm_player_id: Transfermarkt player id.
      confidence: Lowest confidence over the player's team-season links.
      method: auto or manual.
      reason: Reason for a manual decision.
      team_seasons: Number of team-seasons linked.
      games_jaccard: Lowest games_jaccard over the team-seasons.
      name_similarity: Lowest name_similarity over the team-seasons.
      sb_name: StatsBomb name.
      tm_name: Transfermarkt display name.

  # ---------------------------------------------------------------- Transfermarkt
  # Columns marked "snapshot" hold values as of the 2026 snapshot: future information for a
  # 2015/16 back-test. They may describe outcomes but must never be used as features.
  transfermarkt/players:
    description: Transfermarkt players (all players in the dataset, not only ours).
    grain: one row per player
    columns:
      player_id: Transfermarkt player id.
      first_name: First name.
      last_name: Last name.
      name: Display name.
      last_season: "Snapshot: last season the player appears in the tracked competitions."
      current_club_id: "Snapshot: current club."
      player_code: URL slug of the name.
      country_of_birth: Country of birth.
      city_of_birth: City of birth.
      country_of_citizenship: Citizenship.
      date_of_birth: Date of birth (gaps filled by hand from `config/date_of_birth_overrides.csv`, with sources).
      sub_position: Detailed position (e.g. Centre-Forward).
      position: Broad position (Goalkeeper, Defender, Midfield, Attack).
      foot: Preferred foot.
      height_in_cm: Height.
      contract_expiration_date: "Snapshot: current contract end."
      agent_name: "Snapshot: current agent."
      image_url: Picture URL.
      international_caps: "Snapshot: caps to date."
      international_goals: "Snapshot: international goals to date."
      current_national_team_id: "Snapshot: national team."
      url: Transfermarkt profile URL.
      current_club_domestic_competition_id: "Snapshot: league of the current club."
      current_club_name: "Snapshot: current club name."
      market_value_in_eur: "Snapshot: latest market value."
      highest_market_value_in_eur: "Snapshot: highest market value ever (may postdate 2015/16)."

  transfermarkt/player_valuations:
    description: Market value history. Irregular dates; "value at date X" = latest valuation on or before X.
    grain: one row per player and valuation date
    columns:
      player_id: Transfermarkt player id.
      date: Valuation date.
      market_value_in_eur: Market value in euros.
      current_club_name: >-
        Club at the valuation date (reserve and youth teams named separately; spelling can
        differ from `tm_clubs.name`).
      current_club_id: >-
        Not reliably the club at the valuation date: for 2015/16 valuations of pool players it
        is the player's club only 62% of the time, and often the snapshot (2026) club. Use
        `current_club_name`.
      player_club_domestic_competition_id: >-
        Domestic league of `current_club_id` in `tm_clubs` (same caveat), not the league at the
        valuation date.

  transfermarkt/transfers:
    description: >-
      Transfers. Survivorship-biased: no records for players whose `last_season` is before
      2020, incomplete for the others; do not use as a career history.
    grain: one row per transfer
    columns:
      player_id: Transfermarkt player id.
      transfer_date: Date (520 rows are future-dated announced moves).
      transfer_season: Season label (e.g. "16/17").
      from_club_id: Selling club.
      to_club_id: Buying club.
      from_club_name: Selling club name.
      to_club_name: Buying club name.
      transfer_fee: Fee in euros (meaning of 0 vs null not verified).
      market_value_in_eur: Player's market value at the time of the transfer.
      player_name: Player name.

  transfermarkt/appearances:
    description: Player appearances (only players who played).
    grain: one row per player and game
    columns:
      appearance_id: "Appearance id (\"<game_id>_<player_id>\")."
      game_id: Transfermarkt game id.
      player_id: Transfermarkt player id.
      player_club_id: Club the player played for in this game.
      player_current_club_id: "Snapshot: the player's current club."
      date: Game date.
      player_name: Player name.
      competition_id: Competition code.
      yellow_cards: Yellow cards.
      red_cards: Red cards.
      goals: Goals.
      assists: Assists.
      minutes_played: Minutes played (nominal, about 90 for a full match).

  transfermarkt/games:
    description: Games of the tracked competitions.
    grain: one row per game
    columns:
      game_id: Transfermarkt game id.
      competition_id: Competition code (GB1, ES1, IT1, FR1, L1, ...).
      season: Season start year (2015 = 2015/16).
      round: Round label.
      date: Game date.
      home_club_id: Home club.
      away_club_id: Away club.
      home_club_goals: Home goals.
      away_club_goals: Away goals.
      home_club_position: Home club league position.
      away_club_position: Away club league position.
      home_club_manager_name: Home manager.
      away_club_manager_name: Away manager.
      stadium: Stadium.
      attendance: Attendance.
      referee: Referee.
      url: Game URL.
      home_club_formation: Home formation.
      away_club_formation: Away formation.
      home_club_name: Home club name.
      away_club_name: Away club name.
      aggregate: Score as text (e.g. "1:3").
      competition_type: domestic_league, domestic_cup, international_cup, national_team_competition, other.

  transfermarkt/clubs:
    description: "Clubs (796). Squad and value columns are snapshot values."
    grain: one row per club
    columns:
      club_id: Transfermarkt club id.
