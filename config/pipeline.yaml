# Single source of truth for pipeline parameters (sources, competitions, seasons, paths).
# Paths are relative to the project root.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  figures: reports/figures

statsbomb:
  repo: statsbomb/open-data
  # Git ref (commit SHA) the raw files are downloaded from. Pinned so the raw snapshot is
  # reproducible: StatsBomb re-releases files (Ligue 1 2015/16 was last updated 2026-05-12).
  # Latest master commit on 2026-10-06.
  ref: 4b73468fc5b0f1950f9f66fada70ad3a4f9327cb
  season_name: "2015/2016"
  competitions:
    # expected_matches: counts checked in the open-data repo on 2026-10-06, re-verified
    # by `make verify-statsbomb`. scouting_pool: included in league-wide comparisons.
    # transfermarkt_*: the same league-season in Transfermarkt (`games.competition_id`,
    # `games.season`; season 2015 = 2015/16, verified 2026-10-06).
    - name: Premier League
      competition_id: 2
      season_id: 27
      expected_matches: 380
      scouting_pool: true
      transfermarkt_competition_id: GB1
      transfermarkt_season: 2015
    - name: La Liga
      competition_id: 11
      season_id: 27
      expected_matches: 380
      scouting_pool: true
      transfermarkt_competition_id: ES1
      transfermarkt_season: 2015
    - name: Serie A
      competition_id: 12
      season_id: 27
      expected_matches: 380
      scouting_pool: true
      transfermarkt_competition_id: IT1
      transfermarkt_season: 2015
    - name: Ligue 1
      competition_id: 7
      season_id: 27
      expected_matches: 377
      scouting_pool: true
      transfermarkt_competition_id: FR1
      transfermarkt_season: 2015
    - name: 1. Bundesliga
      competition_id: 9
      season_id: 27
      # Bayer Leverkusen's matches only, not the full league. See docs/DECISIONS.md.
      expected_matches: 34
      scouting_pool: false
      transfermarkt_competition_id: L1
      transfermarkt_season: 2015

# StatsBomb position_id -> position group (decided 2026-10-07, see docs/DECISIONS.md).
position_groups:
  - {code: GK, name: Goalkeeper, position_ids: [1]}
  - {code: CB, name: Centre-back, position_ids: [3, 4, 5]}
  - {code: FB, name: Full-back / wing-back, position_ids: [2, 6, 7, 8]}
  - {code: CM, name: Central midfield, position_ids: [9, 10, 11, 13, 14, 15]}
  - {code: AM, name: Attacking midfield, position_ids: [18, 19, 20]}
  - {code: W, name: Wide midfield / winger, position_ids: [12, 16, 17, 21]}
  - {code: CF, name: Centre-forward, position_ids: [22, 23, 24]}

# Groups players are compared within (percentiles, models). Attacking midfield is too small to
# stand alone and plays like the wingers (decided 2026-10-11; the test is in
# notebooks/01_data_exploration.ipynb, section 1.4). Every position group belongs to one.
comparison_groups:
  - {code: GK, name: Goalkeepers, members: [GK]}
  - {code: CB, name: Centre-backs, members: [CB]}
  - {code: FB, name: Full-backs, members: [FB]}
  - {code: CM, name: Central midfielders, members: [CM]}
  - {code: AMW, name: Attacking midfielders and wingers, members: [AM, W]}
  - {code: CF, name: Centre-forwards, members: [CF]}

# Who is compared (decided 2026-10-11; evidence in notebooks/01_data_exploration.ipynb, section
# 1): players with `minutes` real minutes in the pool, or `young_minutes` if they were under
# `young_age` on the back-test's market view.
compared:
  minutes: 900
  young_minutes: 450
  young_age: 23

# The statistics each outfield comparison group's profile is read through, each reliable within
# its group (0.4 or more at 900 minutes), no two at a Spearman correlation of 0.8 or more. Chosen
# from the event counts (decided 2026-10-18; evidence in notebooks/02_player_profiles.ipynb,
# section 1): names of `analysis.metrics` rates and ratios; progressive passes and carries follow
# Wyscout's zones. Two possession-value numbers then took three of their places (decided
# 2026-10-24; evidence in notebooks/03_possession_value.ipynb, section 4): `xt` (a player's xT per
# 90, `xt` below) and `completion_above_expected` (`analysis.xpass`), both in `analysis.profiles`.
profiles:
  CB: [passes, completion_above_expected, long_passes, switches, progressive_passes_zones,
       progressive_carries_zones, aerial_duels, clearances, tackles, recoveries, pressures,
       ball_losses_per_touch]
  FB: [passes, completion_above_expected, progressive_passes_zones, progressive_carries_zones,
       crosses, passes_into_box, key_passes, dribbles, touches_in_box, pressures, tackles,
       recoveries]
  CM: [passes, completion_above_expected, long_passes, progressive_passes_zones,
       progressive_carries_zones, xt, xg, ball_losses_per_touch, pressures, tackles,
       interceptions, recoveries]
  AMW: [xg, shots, xg_per_shot, key_passes, passes_into_box, crosses, dribbles,
        progressive_carries_zones, completion_above_expected, ball_losses_per_touch, pressures,
        tackles]
  CF: [xg, shots, xg_per_shot, touches_in_box, xt, aerial_duels, aerial_win_rate, passes,
       completion_above_expected, dribbles, ball_losses_per_touch, pressures]

# What the possession-value numbers replaced: {group: {number: the statistic chosen from the event
# counts}}. Put back, they give the profiles of notebooks/02_player_profiles.ipynb
# (`Config.count_profiles`), which the analyses made before the change read.
replaced:
  CB: {completion_above_expected: pass_completion}
  FB: {completion_above_expected: pass_completion}
  CM: {completion_above_expected: pass_completion, xt: key_passes}
  AMW: {completion_above_expected: pass_completion}
  CF: {completion_above_expected: pass_completion, xt: passes_into_box}

# The descriptors each outfield comparison group's style is read from (decided 2026-10-28, revised
# 2026-10-29; evidence in notebooks/05_role_discovery.ipynb, section 1): names of `analysis.style`
# descriptors, from the matches a player spent at least half of in a position of their group, put
# on an even share of possession by their slope within players. Each is reliable within its group
# (0.5 or more at 900 minutes on an even share), the team explains less than 0.4 of it beyond
# chance, and no two correlate at 0.8 or more (Spearman, the more reliable kept). The share of
# passes with the left foot says which side a player plays, not which role; so does the inside foot
# where the flank a player is put on explains half of it or more, except among attacking
# midfielders and wingers, where it marks the inverted winger.
# `axes`: how many style axes each group's players are read on (decided 2026-10-28, revised
# 2026-10-29; evidence in notebooks/05_role_discovery.ipynb, section 2): varimax-rotated principal
# components of the shrunk descriptors of the group's regulars, from those above shuffled data,
# while every axis is reliable (0.7 or more at 900 minutes) and found again in random halves of the
# regulars (a mean congruence of 0.85 or more over 20,000 halves, `analysis.roles`). A Gaussian
# mixture found no reproducible roles in any group.
# `names`: each axis's two ends, the low score first, in axis order (decided 2026-10-29; evidence
# in notebooks/05_role_discovery.ipynb, section 3).
roles:
  descriptors:
    CB: [touch_width, box_share, pass_share, carry_distance, pass_length, forward_share,
         backward_share, switch_share, press_share]
    FB: [spread_length, spread_width, defence_height, box_share, pass_share, carry_distance,
         dribble_share, shot_share, cross_share, pass_length, backward_share, switch_share,
         press_share, tackle_share, clearance_share, aerial_share]
    CM: [touch_height, touch_width, spread_length, spread_width, defence_height, box_share,
         pass_share, carry_distance, dribble_share, shot_share, cross_share, pass_length,
         high_share, forward_share, backward_share, switch_share, press_share, tackle_share,
         clearance_share, high_press_share, aerial_share]
    AMW: [touch_height, touch_width, spread_length, spread_width, defence_height, box_share,
          pass_share, carry_distance, shot_share, cross_share, pass_ease, pass_length,
          forward_share, backward_share, switch_share, through_share, inside_foot_share,
          press_share, clearance_share, aerial_share]
    CF: [touch_height, touch_width, spread_length, defence_height, box_share, pass_share,
         carry_distance, dribble_share, shot_share, cross_share, pass_ease, pass_length,
         forward_share, backward_share, inside_foot_share, press_share, clearance_share,
         high_press_share, aerial_share]
  axes: {CB: 3, FB: 3, CM: 4, AMW: 4, CF: 3}
  names:
    CB: [[Short passer, Long passer], [Ball-carrier, Direct passer], [Central, Wide]]
    FB: [[Dribbler, Box defender], [Holds position, Gets into the box],
         [Short passer and presser, Long passer]]
    CM: [[Deep pivot, Advanced midfielder], [Short passer and presser, Long passer],
         [Ground passer, Aerial presence], [Ball-carrier, Forward passer]]
    AMW: [[Link player, Final-third attacker], [Lay-off runner, Forward passer],
          [Inside forward, Touchline winger], [Ball-carrier, Aerial presence]]
    CF: [[Target man, Mobile forward], [Deep-lying forward, Penalty-box striker],
         [Forward passer, Lay-off forward]]

# How a team plays (decided 2026-10-30; evidence in notebooks/07_team_style.ipynb, sections 1 and
# 2). `numbers`: the `analysis.teams` numbers a team's style is read from, over its season's
# matches, its tackles, interceptions, fouls, clearances and pressures on one scale across
# recording contexts; each is reliable (0.7 or more over a season) and no two correlate at 0.8 or
# more across the teams (Spearman, the more reliable kept). `axes`: varimax-rotated principal
# components of the standardised numbers, chosen by the rule of `roles.axes` (above shuffled
# data, a reliability of 0.7 or more over a season, a mean congruence of 0.85 or more in random
# halves of the teams). `names`: each axis's two ends, the low score first, in axis order.
team_style:
  numbers: [ppda, defence_height, high_press_share, counterpress_share, directness,
            long_from_back, long_goal_kicks, wide_entries, cross_share, pass_ease]
  axes: 2
  names: [[Direct, Combination play], [Deep block, High press]]

# Statistics recorded differently between leagues and, in the Premier League, from match week 19.
# Players are compared on them within recording context: each league, and the Premier League
# before and from `since` (decided 2026-10-11 and 2026-10-18; evidence in
# notebooks/01_data_exploration.ipynb, section 3, and notebooks/02_player_profiles.ipynb,
# section 1.3).
recording:
  statistics: [interceptions, pressures, clearances, counterpressures, pressures_final_third]
  changes:
    - {competition_id: 2, since: 2015-12-28}  # Premier League

# Expected threat, the value of having the ball in each zone (decided 2026-10-19; evidence in
# notebooks/03_possession_value.ipynb, sections 1 and 2.1): zones of 2.5 x 2.5 yards, ball losses
# (dispossessions, miscontrols, failed dribbles) ending a chain like failed passes, shots valued
# by their xG; a player's xT sums the gains of their successful passes and carries, a move to a
# zone worth less counting 0 (`analysis.xt`).
xt:
  grid: [48, 32]  # zones along the length, across
  losses: true
  shot_value: xg
  credit: gained  # gained, net or charged (`analysis.xt.CREDITS`)

# The recruitment back-test (decided 2026-10-13; evidence in
# notebooks/01_data_exploration.ipynb, section 4). Players are judged on 2015/16 data and on the
# market value a club could see on `market_view`. Value growth is measured from `outcome_base`,
# after every league's end-of-season revaluation, so that catch-up never counts as a prediction.
# Outcomes are read after each later summer's revaluation, up to five years (the longest
# contract a club could sign in 2016); 2020 is left out (most values then were the flat cut of
# 8 April 2020). A player is still valued at a horizon if their latest valuation is at most
# `still_valued_days` old.
# Outcomes (decided 2026-10-25, notebook 04, section 2): value growth is scored as a percentile
# among players of the same age band (ages on 30 June 2016, bands starting at `age_bands`),
# players no longer valued tied at the bottom; the back-test reads `primary_horizon` first.
# Careers: the league of the club named at each horizon, and the past season's league minutes
# in the `big_five` leagues (`regular_minutes` or more: a regular) and minutes in the
# `champions_league` (Transfermarkt competition ids).
backtest:
  market_view: 2016-06-30
  outcome_base: 2016-08-01
  horizons: [2017-08-31, 2018-08-31, 2019-08-31, 2021-08-31]
  still_valued_days: 365
  primary_horizon: 2019-08-31
  age_bands: [21, 23, 25, 27, 29, 31, 33]
  big_five: [GB1, ES1, IT1, FR1, L1]
  regular_minutes: 900
  champions_league: CL

transfermarkt:
  # dcaribou/transfermarkt-datasets, gzipped CSV exports (license CC0-1.0).
  # Snapshot published 2026-09-05; upstream updates are paused (data up to July 2026).
  # Upstream overwrites these files in place, so each download is recorded with its size,
  # sha256, ETag and Last-Modified in data/raw/transfermarkt/manifest.json.
  base_url: https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data
  tables:
    - players
    - player_valuations
    - transfers
    - clubs
    - appearances
    # competitions: decodes competition codes (e.g. GB1); games: season of each appearance.
    - competitions
    - games

http:
  timeout_seconds: 60
  max_retries: 5
  backoff_seconds: 2.0
  # Parallel downloads for per-match files.
  max_workers: 8
