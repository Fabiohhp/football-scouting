[project]
name = "football-scouting"
version = "0.1.0"
description = "Data-driven football scouting: a historical recruitment back-test on the 2015/16 Big 5 season."
readme = "README.md"
authors = [
    { name = "Fabio", email = "fabiohhp@gmail.com" }
]
# Capped below 3.13 on purpose: socceraction (VAEP, Phase 3) supports Python <3.13 only.
# See docs/DECISIONS.md (2026-10-06).
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyascii>=0.3",
    "duckdb>=1.5.6",
    "httpx>=0.28",
    "matplotlib>=3.9",
    "mplsoccer>=1.8.1",
    "numpy>=2.5.3",
    "pandas>=2.2,<3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# En dash for numeric ranges in figure and table labels ("21–23").
allowed-confusables = ["–"]

[tool.ruff.lint.isort]
known-first-party = ["football_scouting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network and not data'"
markers = [
    "network: tests that call external services (deselected by default; run with -m network)",
    "data: data quality tests on data/processed (deselected by default; run with `make dq`)",
]
